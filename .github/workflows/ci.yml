name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # 与本地一致的版本，避免格式规则漂移产生误报
        run: pip install ruff==0.16.9
      - name: Ruff format check
        # 卡住编辑器按显示宽度自行折行产生的无意义 diff（见评审 P3-2）
        run: ruff format --check .
      - name: Ruff check
        run: ruff check .
      - name: Version consistency
        # README 徽标 / metadata.yaml / CHANGELOG 三处版本必须一致（见评审 P1）
        run: python scripts/check_version.py

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run mdrender unit tests
        # 覆盖围栏属性容忍、媒体标签三种写法与非法 src 回落（零新依赖，Node 内置 test runner）
        run: node --test tests/mdrender.test.mjs
