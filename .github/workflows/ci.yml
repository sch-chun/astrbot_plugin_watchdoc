name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # 与本地一致的版本，避免格式规则漂移产生误报
        run: pip install ruff==0.16.9
      - name: Ruff format check
        # 卡住编辑器按显示宽度自行折行产生的无意义 diff（见评审 P3-2）
        run: ruff format --check .
      - name: Ruff check
        run: ruff check .
      - name: Version consistency
        # README 徽标 / metadata.yaml / CHANGELOG 三处版本必须一致（见评审 P1）
        run: python scripts/check_version.py

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run mdrender unit tests
        # 覆盖围栏属性容忍、媒体标签三种写法与非法 src 回落（零新依赖，Node 内置 test runner）
        run: node --test tests/mdrender.test.mjs

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # 测试需 import astrbot.api，故安装官方 PyPI 包。AstrBot 依赖树较重（60+ 包），
        # 单独成一个 step 便于定位失败来源。版本在此 pin：升级 AstrBot 时同步改这里，
        # 保证 CI 结果可复现（插件 metadata 声明 astrbot_version >=4.24.0）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install "astrbot==4.29.3"
      - name: Prepare AstrBot root
        # AstrBot 按 ASTRBOT_ROOT 推导数据目录；独立 checkout 下不能让它落在插件目录里
        run: mkdir -p "${{ runner.temp }}/astrbot-root"
      - name: Run pytest
        # pytest.ini 的 pythonpath=.. 让 `import astrbot_plugin_watchdoc` 指向仓库自身
        # （GitHub checkout 的目录名即插件包名）；显式给一份 PYTHONPATH 兜底
        env:
          PYTHONPATH: ${{ github.workspace }}/..
          ASTRBOT_ROOT: ${{ runner.temp }}/astrbot-root
        run: pytest -q
